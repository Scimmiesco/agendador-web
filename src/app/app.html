<!-- Card de exemplo no agendador -->
<div class="bg-card border border-borda rounded-2xl p-6 shadow-sm">
  <h2 class="text-texto text-xl font-bold">Consulta Agendada</h2>
  <p class="text-mutado text-sm mt-1">Horário: 14:30 - Quinta-feira</p>

  <!-- Tag de status de alerta pastel -->
  <span class="inline-block mt-3 px-3 py-1 bg-alerta/20 text-alerta text-xs font-semibold rounded-full">
    Aguardando confirmação
  </span>

  <!-- Botões de ação -->
  <div class="mt-5 flex gap-3">
    <button class="bg-primaria hover:bg-primaria-hover text-texto px-4 py-2 rounded-xl font-medium transition">
      Confirmar
    </button>
    <button class="bg-secundaria/20 text-secundaria px-4 py-2 rounded-xl font-medium transition">
      Reagendar
    </button>
    <button class="text-erro hover:underline text-sm font-medium ml-auto">
      Cancelar
    </button>
  </div>
</div>
